# SonarQube analysis config for the whole mono-repo (Java + JS/TS + Python).
# Run after building/testing, with a token from the local SonarQube (see quality/README.md):
#
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<TOKEN>
#
sonar.projectKey=ORAN-Network-Defender
sonar.projectName=O-RAN Network Defender

# --- Sources (per language) ---
sonar.sources=backend/src/main/java,frontend/src,simulator
sonar.tests=backend/src/test/java

# Java needs compiled classes to analyse.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# --- Coverage reports (produced by each layer's test run) ---
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=simulator/coverage.xml

# --- Exclusions ---
sonar.exclusions=**/node_modules/**,frontend/dist/**,**/target/**,frontend/src/main.jsx,frontend/src/NetworkMap3D.jsx
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/test_*.py,backend/src/test/**

sonar.sourceEncoding=UTF-8
