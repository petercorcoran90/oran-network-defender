server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (set on all responses, incl. proxied API + error pages) ---
    server_tokens off;                                              # don't leak nginx version
    add_header X-Content-Type-Options "nosniff" always;             # no MIME sniffing
    add_header X-Frame-Options "DENY" always;                       # anti-clickjacking
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Fonts/scripts/styles are same-origin (self-hosted); React uses inline style attributes,
    # so style-src needs 'unsafe-inline'. No external origins are allowed. Directives without a
    # default-src fallback (form-action, frame-src, worker-src, manifest-src) are set explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'" always;

    # Proxy API calls to the backend. BACKEND_HOST is substituted at container start
    # (envsubst): "backend" under Docker Compose, "backend-service" under Kubernetes.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
