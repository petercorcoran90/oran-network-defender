# Test profile for integration/system tests (@ActiveProfiles("test")).
# The datasource is supplied at runtime by a Testcontainers MySQL instance — see
# AbstractMySqlIntegrationTest — so there is no datasource block here. We only override how
# the schema is handled; everything else (incl. the MySQL dialect) is inherited from application.yml.
spring:
  jpa:
    hibernate:
      # Build the schema from the entities for the test container, then drop it at shutdown.
      ddl-auto: create-drop
    show-sql: false
  # The action catalog is seeded by DatabaseSeeder (CommandLineRunner), not by data.sql.
  sql:
    init:
      mode: never
