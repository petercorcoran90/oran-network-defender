spring:
  application:
    name: oran-network-defender
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orandb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:oran}
    password: ${DB_PASSWORD:oran}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # Never run schema.sql/data.sql against the production database — actions are seeded by
  # DatabaseSeeder. The 'test' profile re-enables this for H2.
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never expose stack traces to clients
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

game:
  incident-interval-seconds: 30
  session-duration-minutes: 15
